<!DOCTYPE html>
<html lang="en">
<html>
<head>
<title>myGame</title>

<style>
    body{
        background-color:#E0FFFF;
        border: 10px double #CCFFFF;
        margin: 0;
        min-height: 100vh;
        font-family: 'Playfair Display';
        overflow: hidden;

    }
     .container {
        display: grid;
        place-items: center;
        height: 100vh;
        text-align: center;
        position: fixed;
        inset: 0;
        z-index: 10;
        background-color: #E0FFFF ;
    }

      .title{
        color: #000000;
        font-size: 50px;


      }
      .settings {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .settings-label {
            font-size: 20px;
        }

        p{
            margin: 5px 0;
        }

</style>
</head>
        <body> 
            <div class="container" id="startScreen">
                <div class="title">
                    Catch the yarn to make a sweater!
                </div>
            <p>Move with the LEFT and RIGHT arrow keys.</p>
            <p>Catch yarn to earn points!</p>
            <p>Avoid the scissors!</p>   

            <img src="sweater.png" width="500" alt="Sweater">
            <div class="settings">
                <div class="settings-label">
                    <label for="playerSpeed">Choose Player Speed:</label>
                <select id="playerSpeed">
                    <option value="100">Slow</option>
                    <option value="300" selected>Medium</option>
                 <option value="600">Very Fast</option>
                </select>
                </div>

                <button id="startButton"> 
                    Start Game 
                </button>
            </div>
        </div>
         
            <script src="src/main.js" type="module"></script>



</body>
</html>
